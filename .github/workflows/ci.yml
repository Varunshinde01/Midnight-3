name: Midnight Eclipse CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Compile Compact & Run Midnight ZK Test Suite
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment (${{ matrix.node-version }})
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci

      - name: Compile Midnight Compact Smart Contract
        run: npm run build:compact

      - name: Validate Production Build Compilation
        run: npm run build

      - name: Run Vitest Privacy & Circuit Test Suite (Replay, Invalid Bids, Unauthorized Settlement, Winner Verification)
        run: npm test

      - name: Verify Midnight Compact & Generated Artifacts
        run: |
          test -f src/contract/SealedBidAuction.compact
          test -f src/managed/sealed_bid_auction/contract/index.ts
          test -f src/managed/sealed_bid_auction/zkir/sealed_bid_auction.zkir
          echo "Midnight Compact contract & generated compiler artifacts validated successfully!"
