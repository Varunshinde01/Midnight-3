name: Midnight Eclipse CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Compile & Run Midnight ZK Test Suite
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment (${{ matrix.node-version }})
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci

      - name: Validate Production Build Compilation
        run: npm run build

      - name: Run Vitest Privacy & Circuit Test Suite
        run: npm test

      - name: Verify Midnight Compact Source Artifacts
        run: |
          test -f src/contract/SealedBidAuction.compact
          echo "Midnight Compact contract definition validated!"
